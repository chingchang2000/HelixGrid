[package]
name = "helix-worker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "HelixGrid distributed task worker runtime"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18", features = ["v4"] }
