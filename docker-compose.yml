name: helixgrid

services:
  coordinator:
    build:
      context: ./coordinator
    environment:
      HELIX_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    environment:
      HELIX_COORDINATOR: http://coordinator:8080
      HELIX_CONCURRENCY: "4"
      HELIX_POLL_MS: "250"
      HELIX_HEARTBEAT_SECONDS: "10"
      HELIX_LEASE_RENEW_SECONDS: "6"
      RUST_LOG: helix_worker=info
    depends_on:
      - coordinator
    init: true
    restart: unless-stopped
