name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-size:
    name: Source size ≥10k lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count hand-maintained source code
        run: python scripts/code_stats.py . --minimum 10000 --files

  go:
    name: Go coordinator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: coordinator/go.mod
      - name: Normalize formatting in CI workspace
        run: gofmt -w .
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build coordinator and load generator
        run: |
          go build -trimpath ./cmd/helixd
          go build -trimpath ./cmd/helix-loadgen

  rust:
    name: Rust worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
      - name: Normalize formatting in CI workspace
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Release build
        run: cargo build --release

  python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Install package
        run: python -m pip install -e ./sdk/python
      - name: Compile bytecode
        run: python -m compileall -q sdk/python/src
      - name: Unit tests
        env:
          PYTHONPATH: sdk/python/src
        run: python -m unittest discover -s sdk/python/tests -v
      - name: CLI smoke test
        run: helix --help >/dev/null

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --ignore-scripts
      - name: Strict typecheck
        run: npm run check
      - name: Build declarations and JS
        run: npm run build

  cpp:
    name: C++ simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S simulator -B build/simulator -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/simulator --parallel 2
      - name: Test
        run: ctest --test-dir build/simulator --output-on-failure
      - name: Determinism check
        run: |
          build/simulator/helix-sim --demo --workers 4 --runs 100 --seed 1337 --json > first.json
          build/simulator/helix-sim --demo --workers 4 --runs 100 --seed 1337 --json > second.json
          diff -u first.json second.json

  java:
    name: Java replay verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile zero-dependency verifier
        run: |
          mkdir -p build/replay-verifier
          javac --release 21 -Xlint:all -Werror \
            -d build/replay-verifier \
            tools/replay-verifier/src/main/java/dev/helixgrid/verifier/Json.java \
            tools/replay-verifier/src/main/java/dev/helixgrid/verifier/Main.java
      - name: CLI smoke test
        run: java -cp build/replay-verifier dev.helixgrid.verifier.Main --help >/dev/null

  protocol:
    name: Protocol contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse JSON schema
        run: python -m json.tool protocol/workflow.schema.json >/dev/null
      - name: Parse example JSON
        run: python -m json.tool examples/workflow.json >/dev/null
      - name: Validate YAML syntax
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import pathlib, yaml
          yaml.safe_load(pathlib.Path('protocol/openapi.yaml').read_text())
          print('OpenAPI YAML parsed successfully')
          PY

  docker:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [go, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build coordinator image
        uses: docker/build-push-action@v6
        with:
          context: coordinator
          push: false
          tags: helixgrid/coordinator:ci
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: false
          tags: helixgrid/worker:ci
