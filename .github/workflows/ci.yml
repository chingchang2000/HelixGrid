name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-size:
    name: Source size ≥10k lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count hand-maintained source code
        run: python scripts/code_stats.py . --minimum 10000 --files

  go:
    name: Go coordinator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: coordinator/go.mod
      - name: Normalize formatting in CI workspace
        run: find . -name '*.go' -type f -print0 | xargs -0 gofmt -w
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build coordinator and load generator
        run: |
          go build -trimpath ./cmd/helixd
          go build -trimpath ./cmd/helix-loadgen

  rust:
    name: Rust worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
      - name: Normalize formatting in CI workspace
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Release build
        run: cargo build --release

  python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Install package
        run: python -m pip install -e ./sdk/python
      - name: Compile bytecode
        run: python -m compileall -q sdk/python/src
      - name: Unit tests
        env:
          PYTHONPATH: sdk/python/src
        run: |
          python -m unittest discover -s sdk/python/tests -v
          python -m unittest discover -s tools/chaos_lab/tests -v
          python -m unittest discover -s worker/tests -v
      - name: CLI smoke test
        run: helix --help >/dev/null

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --ignore-scripts
      - name: Strict typecheck
        run: npm run check
      - name: Build and runtime tests
        run: npm test

  cpp:
    name: C++ simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S simulator -B build/simulator -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/simulator --parallel 2
      - name: Test
        run: ctest --test-dir build/simulator --output-on-failure
      - name: Determinism check
        run: |
          build/simulator/helix-sim --demo --workers 4 --runs 100 --seed 1337 --json > first.json
          build/simulator/helix-sim --demo --workers 4 --runs 100 --seed 1337 --json > second.json
          diff -u first.json second.json

  java:
    name: Java replay verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile zero-dependency verifier
        run: |
          mkdir -p build/replay-verifier
          javac --release 21 -Xlint:all -Werror \
            -d build/replay-verifier \
            tools/replay-verifier/src/main/java/dev/helixgrid/verifier/Json.java \
            tools/replay-verifier/src/main/java/dev/helixgrid/verifier/Main.java
      - name: CLI smoke test
        run: java -cp build/replay-verifier dev.helixgrid.verifier.Main --help >/dev/null
      - name: Replay cancellation fixture
        run: |
          java -cp build/replay-verifier dev.helixgrid.verifier.Main \
            tools/replay-verifier/tests/cancellation.jsonl --strict --summary-only
      - name: Replay task cancellation fixture
        run: |
          java -cp build/replay-verifier dev.helixgrid.verifier.Main \
            tools/replay-verifier/tests/task-cancellation.jsonl --strict --summary-only
      - name: Replay expiry fixture and verify single count
        run: |
          java -cp build/replay-verifier dev.helixgrid.verifier.Main \
            tools/replay-verifier/tests/lease-expiry.jsonl --json > expiry.json
          grep -q '"expired_leases":1' expiry.json

  protocol:
    name: Protocol contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse JSON schema
        run: python -m json.tool protocol/workflow.schema.json >/dev/null
      - name: Parse example JSON
        run: python -m json.tool examples/workflow.json >/dev/null
      - name: Validate contracts and example
        run: |
          python -m pip install pyyaml jsonschema
          python - <<'PY'
          import json
          import pathlib
          import yaml
          from jsonschema import Draft202012Validator

          schema = json.loads(pathlib.Path('protocol/workflow.schema.json').read_text())
          example = json.loads(pathlib.Path('examples/workflow.json').read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(example)

          openapi = yaml.safe_load(pathlib.Path('protocol/openapi.yaml').read_text())
          assert openapi['openapi'] == '3.1.0'
          assert '/v1/workflows' in openapi['paths']
          print('JSON Schema, example, and OpenAPI contracts validated')
          PY

  postgres-schema:
    name: PostgreSQL schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        run: |
          docker run -d --name helix-postgres \
            -e POSTGRES_PASSWORD=helix \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec helix-postgres pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs helix-postgres
          exit 1
      - name: Apply durable schema
        run: docker exec -i helix-postgres psql -U postgres -v ON_ERROR_STOP=1 < storage/postgres/schema.sql

  docker:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [go, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build coordinator image
        uses: docker/build-push-action@v6
        with:
          context: coordinator
          push: false
          tags: helixgrid/coordinator:ci
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: false
          tags: helixgrid/worker:ci

  integration:
    name: Runtime integration
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Start cluster and execute workflow
        run: |
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose logs --no-color
            fi
            docker compose down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          docker compose up -d --build --scale worker=1

          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8080"

          def request(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(base + path, data=data, method=method)
              req.add_header("Accept", "application/json")
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=5) as response:
                  raw = response.read()
                  return {} if not raw else json.loads(raw)

          deadline = time.monotonic() + 45
          while True:
              try:
                  request("GET", "/healthz")
                  break
              except (OSError, urllib.error.URLError):
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(0.5)

          payload = {
              "name": "ci-integration",
              "tasks": [
                  {"id": "prepare", "command": ["sh", "-lc", "echo prepare"]},
                  {
                      "id": "finish",
                      "depends_on": ["prepare"],
                      "command": ["sh", "-lc", "echo finish"],
                  },
              ],
          }
          workflow = request("POST", "/v1/workflows", payload)["data"]
          workflow_id = workflow["id"]

          deadline = time.monotonic() + 45
          while True:
              workflow = request("GET", f"/v1/workflows/{workflow_id}")["data"]
              if workflow["state"] in {"SUCCEEDED", "FAILED", "CANCELLED"}:
                  break
              if time.monotonic() >= deadline:
                  raise TimeoutError(f"workflow did not finish: {workflow}")
              time.sleep(0.25)

          assert workflow["state"] == "SUCCEEDED", workflow
          workers = request("GET", "/v1/workers")["data"]
          assert workers, "no worker registered"
          assert all(worker["active_leases"] == 0 for worker in workers), workers
          print("runtime integration workflow succeeded")
          PY
